<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加入官方群 · 剑修哥</title>
<link rel="icon" type="image/jpeg" href="images/avatar.jpg">
<link rel="apple-touch-icon" href="images/avatar.jpg">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink-deep: #3a3f5c; --ink-dark: #4a4f6b; --ink-mid: #6b7089;
  --ink-light: #8f94ab; --ink-faint: #b8bccd;
  --paper-light: #ffffff; --paper-base: #f7f8fc;
  --paper-warm: #eef0f8; --paper-deep: #dfe3f0;
  --cinnabar: #ff6b9d; --cinnabar-light: #ff8fb8; --cinnabar-deep: #e0527f;
  --jade: #5ab0ff; --jade-light: #8cc8ff; --jade-deep: #3a8fdb;
  --gold: #ffb84d; --gold-light: #ffd78a; --gold-deep: #e69c30;
  --font-display: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-serif: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-sans: 'Noto Sans SC', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-serif); color: var(--ink-dark);
  background: var(--paper-base); min-height: 100vh;
  overflow-x: hidden; position: relative; line-height: 1.7;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}

.bg-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-layer::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(139, 119, 91, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(100, 80, 60, 0.05) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
  opacity: 0.8;
}

.group-container {
  position: relative; z-index: 2;
  max-width: 460px; width: 100%;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(12px);
  border: 1px solid var(--paper-deep);
  border-radius: 12px;
  padding: 48px 36px 40px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(26,22,19,0.1);
  animation: fadeInUp 0.8s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.stats-corner {
  position: absolute; width: 28px; height: 28px; border: 2px solid var(--gold);
}
.corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.group-icon {
  width: 72px; height: 72px; margin: 0 auto 20px;
  background: linear-gradient(135deg, #12B7F5, #0099FF);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(18, 183, 245, 0.35);
  animation: iconPulse 2s ease-in-out infinite;
}
@keyframes iconPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(18, 183, 245, 0.35); }
  50% { transform: scale(1.05); box-shadow: 0 8px 32px rgba(18, 183, 245, 0.5); }
}
.group-icon svg { width: 40px; height: 40px; fill: white; }

.group-title {
  font-family: var(--font-display);
  font-size: 32px; color: var(--ink-deep);
  letter-spacing: 6px; margin-bottom: 8px;
}
.group-subtitle {
  font-size: 14px; color: var(--ink-light);
  letter-spacing: 3px; margin-bottom: 28px;
}

.group-qrcode-wrap {
  position: relative;
  width: 260px; height: 260px;
  margin: 0 auto 24px;
  padding: 12px;
  background: white;
  border-radius: 12px;
  border: 2px solid var(--paper-deep);
  box-shadow: 0 8px 32px rgba(26,22,19,0.12);
}
.group-qrcode-wrap::before {
  content: ''; position: absolute; inset: -6px;
  border: 1px dashed var(--gold); border-radius: 16px;
  pointer-events: none;
}
.group-qrcode-wrap img {
  width: 100%; height: 100%; object-fit: contain;
  border-radius: 8px; display: block;
}

.group-number-card {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; padding: 14px 20px;
  background: rgba(18, 183, 245, 0.08);
  border: 1px solid rgba(18, 183, 245, 0.25);
  border-radius: 8px; margin-bottom: 20px;
}
.group-number-label {
  font-size: 14px; color: var(--ink-mid); letter-spacing: 2px;
}
.group-number {
  font-family: var(--font-serif); font-size: 22px; font-weight: 700;
  color: #0099FF; letter-spacing: 2px;
}
.copy-btn {
  background: none; border: 1px solid var(--paper-deep); color: var(--ink-mid);
  cursor: pointer; padding: 5px 12px; border-radius: 4px;
  display: flex; align-items: center; gap: 4px;
  transition: all 0.2s ease; font-family: var(--font-sans); font-size: 12px;
}
.copy-btn:hover {
  border-color: #0099FF; color: #0099FF; background: rgba(0,153,255,0.06);
}
.copy-btn svg { width: 13px; height: 13px; }

.group-tips {
  font-size: 13px; color: var(--ink-light); line-height: 1.8;
  margin-bottom: 28px; text-align: left;
  padding: 16px 20px; background: rgba(255,255,255,0.4);
  border-radius: 8px; border-left: 3px solid var(--gold);
}
.group-tips p { margin-bottom: 6px; }
.group-tips p:last-child { margin-bottom: 0; }

.back-home {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--ink-mid); text-decoration: none;
  font-size: 14px; letter-spacing: 2px;
  padding: 10px 24px; border: 1px solid var(--paper-deep);
  border-radius: 50px; transition: all 0.3s ease;
  font-family: var(--font-display);
}
.back-home:hover {
  color: var(--cinnabar); border-color: var(--cinnabar);
  background: rgba(184,52,46,0.05);
}

.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: var(--ink-deep); color: var(--paper-light);
  padding: 14px 28px; border-radius: 8px; font-family: var(--font-sans);
  font-size: 14px; letter-spacing: 2px; opacity: 0; pointer-events: none;
  transition: all 0.3s ease; z-index: 1000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

@media (max-width: 480px) {
  .group-container { padding: 36px 24px 32px; }
  .group-title { font-size: 26px; letter-spacing: 4px; }
  .group-qrcode-wrap { width: 220px; height: 220px; }
  .group-number { font-size: 18px; }
}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="ink-wash ink-wash-1"></div>
  <div class="ink-wash ink-wash-2"></div>
</div>

<div class="group-container">
  <div class="stats-corner corner-tl"></div>
  <div class="stats-corner corner-tr"></div>
  <div class="stats-corner corner-bl"></div>
  <div class="stats-corner corner-br"></div>

  <div class="group-icon">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
  </div>

  <h1 class="group-title">加入官方群</h1>
  <p class="group-subtitle">留璃丨剑修支援群</p>

  <div class="group-qrcode-wrap">
    <img src="images/group-qrcode.jpg" alt="QQ群二维码">
  </div>

  <div class="group-number-card">
    <span class="group-number-label">群号</span>
    <span class="group-number">1003572258</span>
    <button class="copy-btn" onclick="copyGroupNumber()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      复制
    </button>
  </div>

  <div class="group-tips">
    <p>📱 手机QQ扫码即可加入</p>
    <p>💬 群内分享材质包、光影、PVP技巧</p>
    <p>🎮 第一时间获取视频更新通知</p>
    <p>🤝 与其他玩家交流游戏心得</p>
  </div>

  <a href="/" class="back-home">← 返回首页</a>
</div>

<div id="toast" class="toast"><span>群號已複製</span></div>

<script>
function copyGroupNumber() {
  const text = '1003572258';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(showToast);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  }
}
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
</script>

</body>
</html>
