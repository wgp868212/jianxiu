<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · 剑修哥</title>
<link rel="icon" type="image/jpeg" href="images/avatar.jpg">
<link rel="apple-touch-icon" href="images/avatar.jpg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink-deep: #3a3f5c; --ink-dark: #4a4f6b; --ink-mid: #6b7089;
  --ink-light: #8f94ab; --ink-faint: #b8bccd;
  --pink: #ff6b9d; --pink-light: #ff8fb8; --pink-deep: #e0527f;
  --blue: #5ab0ff; --blue-light: #8cc8ff; --blue-deep: #3a8fdb;
  --gold: #ffb84d;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--ink-dark);
  min-height: 100vh;
  background: linear-gradient(135deg, #f7f8fc 0%, #e8ecf8 50%, #f0e8f8 100%);
  background-attachment: fixed;
  line-height: 1.7;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,107,157,0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(90,176,255,0.08) 0%, transparent 40%);
  pointer-events: none; z-index: 0;
}

/* 导航栏 */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 14px 32px;
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(255,255,255,0.5);
  box-shadow: 0 4px 30px rgba(0,0,0,0.08);
}
.nav-left {
  position: absolute; left: 32px;
  display: flex; align-items: center; gap: 12px; text-decoration: none;
}
.nav-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.9);
  box-shadow: 0 2px 12px rgba(255,107,157,0.2);
}
.nav-brand {
  font-size: 18px; font-weight: 700; color: var(--ink-deep);
  letter-spacing: 1px;
}
.nav-links {
  display: flex; gap: 28px; list-style: none;
}
.nav-links a {
  text-decoration: none; color: var(--ink-mid);
  font-size: 14px; font-weight: 500;
  transition: color 0.3s; position: relative;
}
.nav-links a:hover, .nav-links a.active { color: var(--pink); }
.nav-links a.active::after {
  content: ''; position: absolute; bottom: -6px; left: 50%;
  transform: translateX(-50%); width: 20px; height: 2px;
  background: var(--pink); border-radius: 2px;
}

/* 主容器 */
.page-wrapper {
  position: relative; z-index: 2;
  max-width: 800px; margin: 100px auto 60px;
  padding: 40px 36px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.1);
}

/* 页面标题 */
.page-header {
  text-align: center; margin-bottom: 32px;
}
.page-title {
  font-size: 32px; font-weight: 900; color: var(--ink-deep);
  letter-spacing: 4px; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--ink-deep), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.page-subtitle {
  font-size: 14px; color: var(--ink-light); letter-spacing: 2px;
}
.msg-count {
  display: inline-block; margin-top: 12px;
  font-size: 12px; color: var(--blue-deep);
  background: rgba(90,176,255,0.12);
  padding: 4px 14px; border-radius: 12px;
}

/* 留言表单 */
.msg-form {
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: 20px;
  padding: 24px; margin-bottom: 28px;
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 13px; color: var(--ink-mid);
  margin-bottom: 6px; font-weight: 500;
}
.form-group input, .form-group textarea {
  width: 100%; padding: 12px 16px;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 12px; font-size: 14px; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: rgba(255,255,255,0.6);
  font-family: inherit; color: var(--ink-dark);
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(255,107,157,0.12);
}
.form-group textarea { resize: vertical; min-height: 100px; }
.form-group input:disabled {
  background: rgba(0,0,0,0.04); color: var(--ink-light);
  cursor: not-allowed;
}
.login-hint {
  font-size: 12px; color: var(--blue-deep);
  margin-top: 6px; display: flex; align-items: center; gap: 6px;
}
.login-hint a { color: var(--pink); text-decoration: none; font-weight: 500; }
.submit-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--pink), var(--pink-deep));
  color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(255,107,157,0.35);
}

/* 留言列表 */
.msg-list { display: flex; flex-direction: column; gap: 16px; }
.msg-item {
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: 18px;
  padding: 20px 24px;
  position: relative;
  animation: msgIn 0.4s ease;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.msg-user {
  display: flex; align-items: center; gap: 10px;
}
.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), var(--blue));
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 14px; font-weight: 700;
  flex-shrink: 0;
}
.msg-name {
  font-size: 14px; font-weight: 600; color: var(--ink-deep);
}
.msg-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 8px;
  background: linear-gradient(135deg, var(--gold), #e69c30);
  color: white; font-weight: 600; margin-left: 6px;
}
.msg-anon-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 8px;
  background: rgba(0,0,0,0.1); color: var(--ink-mid);
  font-weight: 500; margin-left: 6px;
}
.msg-time {
  font-size: 12px; color: var(--ink-faint);
}
.msg-content {
  font-size: 14px; color: var(--ink-dark);
  line-height: 1.7; word-break: break-word;
  white-space: pre-wrap;
}
.msg-delete {
  position: absolute; top: 16px; right: 16px;
  background: none; border: none; color: var(--ink-faint);
  cursor: pointer; font-size: 16px; padding: 4px 8px;
  border-radius: 6px; transition: all 0.2s; opacity: 0;
}
.msg-item:hover .msg-delete { opacity: 1; }
.msg-delete:hover { background: rgba(255,107,157,0.1); color: var(--pink); }

/* 空状态 */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--ink-faint);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 14px; }

/* 底部 */
.page-footer {
  text-align: center; margin-top: 32px; padding-top: 20px;
  border-top: 1px solid rgba(0,0,0,0.06);
  font-size: 12px; color: var(--ink-faint); letter-spacing: 1px;
}

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(58,63,92,0.9); color: white;
  padding: 12px 28px; border-radius: 20px;
  font-size: 14px; opacity: 0;
  transition: all 0.3s; z-index: 1000;
  pointer-events: none;
  backdrop-filter: blur(10px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 响应式 */
@media (max-width: 768px) {
  .top-nav { padding: 12px 16px; }
  .nav-left { left: 16px; }
  .nav-brand { display: none; }
  .nav-links { gap: 14px; }
  .nav-links a { font-size: 12px; }
  .page-wrapper { margin: 80px 12px 40px; padding: 24px 16px; border-radius: 20px; }
  .page-title { font-size: 24px; }
  .msg-form { padding: 18px; }
  .msg-item { padding: 16px; }
  .msg-delete { opacity: 1; }
}
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="top-nav">
  <a href="index.html" class="nav-left">
    <img src="images/avatar.jpg" alt="剑修哥" class="nav-avatar">
    <span class="nav-brand">剑修哥</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">首页</a></li>
    <li><a href="Downloads/index.html">下载</a></li>
    <li><a href="rz.html">日志</a></li>
    <li><a href="lyb.html" class="active">留言板</a></li>
    <li><a href="wallpaper.html">壁纸</a></li>
    <li><a href="ds.html">赞赏</a></li>
    <li><a href="jr.html">加群</a></li>
  </ul>
</nav>

<!-- 主内容 -->
<div class="page-wrapper">
  <div class="page-header">
    <h1 class="page-title">留言板</h1>
    <p class="page-subtitle">MESSAGE BOARD · 想说什么就说什么</p>
    <div class="msg-count" id="msgCount">共 0 条留言</div>
  </div>

  <!-- 留言表单 -->
  <div class="msg-form">
    <div class="form-group">
      <label>昵称</label>
      <input type="text" id="msgName" placeholder="请输入昵称（匿名留言）" maxlength="20">
      <div class="login-hint" id="loginHint">
        💡 登录后留言会显示专属标识，<a href="index.html" onclick="localStorage.setItem('lyb_redirect','1')">去登录</a>
      </div>
    </div>
    <div class="form-group">
      <label>留言内容</label>
      <textarea id="msgContent" placeholder="写下你想说的话..." maxlength="500"></textarea>
    </div>
    <button class="submit-btn" onclick="submitMsg()">发表留言</button>
  </div>

  <!-- 留言列表 -->
  <div class="msg-list" id="msgList">
    <!-- 动态生成 -->
  </div>

  <div class="page-footer">
    <p>© 2026 剑修哥 · 留言板 · 文明留言，友善交流</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 获取当前登录用户
function getCurrentUser() {
  try {
    return JSON.parse(localStorage.getItem('jx_current_user'));
  } catch(e) { return null; }
}

// 初始化页面
function init() {
  const user = getCurrentUser();
  const nameInput = document.getElementById('msgName');
  const loginHint = document.getElementById('loginHint');
  
  if (user) {
    nameInput.value = user.email;
    nameInput.disabled = true;
    loginHint.innerHTML = '✅ 已登录为 <strong>' + user.email + '</strong>，留言将显示「登录用户」标识';
  }
  
  // 检查是否从首页登录跳转回来
  if (localStorage.getItem('lyb_redirect')) {
    localStorage.removeItem('lyb_redirect');
  }
  
  renderMsgs();
}

// 提交留言
function submitMsg() {
  const nameInput = document.getElementById('msgName');
  const contentInput = document.getElementById('msgContent');
  const user = getCurrentUser();
  
  let name = nameInput.value.trim();
  const content = contentInput.value.trim();
  
  if (!name) { showToast('请输入昵称'); return; }
  if (!content) { showToast('请输入留言内容'); return; }
  
  const msgs = getMsgs();
  const newMsg = {
    id: Date.now(),
    name: name,
    content: content,
    time: new Date().toLocaleString('zh-CN'),
    timestamp: Date.now(),
    isLogin: !!user,
    userEmail: user ? user.email : null
  };
  
  msgs.unshift(newMsg);
  localStorage.setItem('lyb_messages', JSON.stringify(msgs));
  
  contentInput.value = '';
  if (!user) nameInput.value = '';
  
  renderMsgs();
  showToast('留言成功！');
}

// 获取留言列表
function getMsgs() {
  try {
    return JSON.parse(localStorage.getItem('lyb_messages') || '[]');
  } catch(e) { return []; }
}

// 渲染留言
function renderMsgs() {
  const msgs = getMsgs();
  const list = document.getElementById('msgList');
  const countEl = document.getElementById('msgCount');
  const user = getCurrentUser();
  
  countEl.textContent = '共 ' + msgs.length + ' 条留言';
  
  if (msgs.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>还没有留言，来抢沙发吧！</p></div>';
    return;
  }
  
  list.innerHTML = msgs.map(function(msg) {
    const initial = msg.name.charAt(0).toUpperCase();
    const canDelete = user && user.email === msg.userEmail;
    const badge = msg.isLogin 
      ? '<span class="msg-badge">登录用户</span>'
      : '<span class="msg-anon-badge">匿名</span>';
    const deleteBtn = canDelete 
      ? '<button class="msg-delete" onclick="deleteMsg(' + msg.id + ')" title="删除">🗑</button>'
      : '';
    
    return '<div class="msg-item">'
      + deleteBtn
      + '<div class="msg-header">'
      + '<div class="msg-user">'
      + '<div class="msg-avatar">' + initial + '</div>'
      + '<span class="msg-name">' + escapeHtml(msg.name) + '</span>'
      + badge
      + '</div>'
      + '<span class="msg-time">' + msg.time + '</span>'
      + '</div>'
      + '<div class="msg-content">' + escapeHtml(msg.content) + '</div>'
      + '</div>';
  }).join('');
}

// 删除留言
function deleteMsg(id) {
  if (!confirm('确定删除这条留言吗？')) return;
  let msgs = getMsgs();
  msgs = msgs.filter(function(m) { return m.id !== id; });
  localStorage.setItem('lyb_messages', JSON.stringify(msgs));
  renderMsgs();
  showToast('已删除');
}

// HTML转义
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Toast提示
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// 回车提交
document.getElementById('msgContent').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    submitMsg();
  }
});

init();
</script>

</body>
</html>
