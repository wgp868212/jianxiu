<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赞赏支持 · 剑修哥</title>
<link rel="icon" type="image/jpeg" href="images/avatar.jpg">
<link rel="apple-touch-icon" href="images/avatar.jpg">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink-deep: #3a3f5c; --ink-dark: #4a4f6b; --ink-mid: #6b7089;
  --ink-light: #8f94ab; --ink-faint: #b8bccd;
  --paper-light: #ffffff; --paper-base: #f7f8fc;
  --paper-warm: #eef0f8; --paper-deep: #dfe3f0;
  --cinnabar: #ff6b9d; --cinnabar-light: #ff8fb8; --cinnabar-deep: #e0527f;
  --jade: #5ab0ff; --jade-light: #8cc8ff; --jade-deep: #3a8fdb;
  --gold: #ffb84d; --gold-light: #ffd78a; --gold-deep: #e69c30;
  --font-display: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-serif: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-sans: 'Noto Sans SC', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-serif); color: var(--ink-dark);
  background: var(--paper-base); min-height: 100vh;
  overflow-x: hidden; position: relative; line-height: 1.7;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}

.bg-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-layer::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(139, 119, 91, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(100, 80, 60, 0.05) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
  opacity: 0.8;
}

  66% { transform: translate(-20px, 20px) scale(0.95); }
}

.reward-container {
  position: relative; z-index: 2;
  max-width: 460px; width: 100%;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(12px);
  border: 1px solid var(--paper-deep);
  border-radius: 12px;
  padding: 48px 36px 40px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(26,22,19,0.1);
  animation: fadeInUp 0.8s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.stats-corner {
  position: absolute; width: 28px; height: 28px; border: 2px solid var(--gold);
}
.corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.seal-badge {
  width: 72px; height: 72px; margin: 0 auto 20px;
  border-radius: 50%; overflow: hidden;
  border: 3px solid rgba(255,255,255,0.9);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.seal-badge img {
  width: 100%; height: 100%; object-fit: cover;
}

.reward-title {
  font-family: var(--font-display); font-size: 36px; color: var(--ink-deep);
  letter-spacing: 10px; margin-bottom: 8px; font-weight: 400;
}
.title-divider {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; margin-bottom: 24px;
}
.divider-line {
  display: block; width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink-faint), transparent);
}
.divider-jade { color: var(--jade); font-size: 12px; }

.reward-subtitle {
  font-family: var(--font-serif); font-size: 15px; color: var(--ink-mid);
  letter-spacing: 3px; margin-bottom: 32px;
}

.qrcode-wrapper {
  width: 260px; height: 260px; margin: 0 auto 24px;
  background: white; border-radius: 12px; padding: 12px;
  box-shadow: 0 8px 32px rgba(26,22,19,0.12);
  border: 1px solid var(--paper-warm);
}
.qrcode-wrapper img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 8px;
  display: block;
}

.pay-method {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 18px; background: rgba(7,193,96,0.1);
  border: 1px solid rgba(7,193,96,0.2); border-radius: 20px;
  font-family: var(--font-sans); font-size: 13px; color: #07c160;
  margin-bottom: 28px;
}
.pay-method svg { width: 16px; height: 16px; fill: #07c160; }

.reward-thanks {
  font-family: var(--font-display); font-size: 14px; color: var(--ink-light);
  letter-spacing: 4px; margin-bottom: 28px;
}

.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px; background: rgba(255,255,255,0.7);
  border: 1px solid var(--paper-deep); border-radius: 50px;
  font-family: var(--font-display); font-size: 15px; color: var(--ink-deep);
  text-decoration: none; letter-spacing: 3px;
  transition: all 0.3s ease;
}
.back-btn:hover {
  background: var(--ink-deep); color: var(--paper-light);
  border-color: var(--ink-deep); transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(26,22,19,0.2);
}
.back-btn svg { width: 16px; height: 16px; }

@media (max-width: 480px) {
  .reward-container { padding: 36px 24px 32px; }
  .reward-title { font-size: 28px; letter-spacing: 6px; }
  .qrcode-wrapper { width: 220px; height: 220px; }
}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="ink-wash ink-wash-1"></div>
  <div class="ink-wash ink-wash-2"></div>
</div>

<div class="reward-container">
  <div class="stats-corner corner-tl"></div>
  <div class="stats-corner corner-tr"></div>
  <div class="stats-corner corner-bl"></div>
  <div class="stats-corner corner-br"></div>

  <div class="seal-badge"><span>劍</span></div>

  <h1 class="reward-title">赞赏支持</h1>

  <div class="title-divider">
    <span class="divider-line"></span>
    <span class="divider-jade">◆</span>
    <span class="divider-line"></span>
  </div>

  <p class="reward-subtitle">你的支持是我持续更新的最大动力</p>

  <div class="qrcode-wrapper">
    <img src="images/reward.jpg" alt="微信收款码">
  </div>

  <div class="pay-method">
    <svg viewBox="0 0 24 24"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
    微信支付
  </div>

  <p class="reward-thanks">— 感谢你的慷慨支持 —</p>

  <a href="/" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    返回主页
  </a>
</div>

</body>
</html>
