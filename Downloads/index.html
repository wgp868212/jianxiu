<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑修哥 · 资源下载</title>

<link rel="apple-touch-icon" href="../images/avatar.jpg">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================
   剑修哥 · 資源下載
   風格：仙俠 / 武俠 · 水墨意境
   ============================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink-deep: #3a3f5c; --ink-dark: #4a4f6b; --ink-mid: #6b7089;
  --ink-light: #8f94ab; --ink-faint: #b8bccd;
  --paper-light: #ffffff; --paper-base: #f7f8fc;
  --paper-warm: #eef0f8; --paper-deep: #dfe3f0;
  --cinnabar: #ff6b9d; --cinnabar-light: #ff8fb8; --cinnabar-deep: #e0527f;
  --jade: #5ab0ff; --jade-light: #8cc8ff; --jade-deep: #3a8fdb;
  --gold: #ffb84d; --gold-light: #ffd78a; --gold-deep: #e69c30;
  --font-display: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-serif: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-sans: 'Noto Sans SC', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-serif); color: var(--ink-dark);
  background: var(--paper-base); min-height: 100vh;
  overflow-x: hidden; position: relative; line-height: 1.7;
}

.bg-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-layer::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(139, 119, 91, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(100, 80, 60, 0.05) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
  opacity: 0.8;
}


  66% { transform: translate(-20px, 20px) scale(0.95); }
}


}

/* 导航栏 */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 14px 24px;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.5);
  box-shadow: 0 2px 20px rgba(0,0,0,0.06);
}
.nav-left {
  position: absolute; left: 24px;
  display: flex; align-items: center; gap: 12px; text-decoration: none;
}
.seal-logo {
  width: 40px; height: 40px; background: var(--cinnabar); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-3deg); transition: transform 0.3s ease;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15), 0 2px 8px rgba(184,52,46,0.3);
}
.seal-logo:hover { transform: rotate(0deg) scale(1.1); }
.seal-text {
  font-family: var(--font-display); font-size: 22px; color: var(--paper-light);
  font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.nav-title {
  font-family: var(--font-display); font-size: 17px; color: var(--ink-deep); letter-spacing: 3px;
}
.nav-menu {
  display: flex; align-items: center; gap: 8px; list-style: none;
}
.nav-menu a {
  font-family: var(--font-display); font-size: 15px; color: var(--ink-mid);
  text-decoration: none; padding: 6px 14px; border-radius: 6px;
  position: relative; transition: all 0.3s ease;
}
.nav-menu a:hover {
  color: var(--cinnabar); background: rgba(184,52,46,0.08);
}
.nav-menu a.active {
  color: var(--cinnabar); background: rgba(184,52,46,0.1);
}
.nav-menu a.nav-bilibili {
  color: #fb7299; border: 1px solid rgba(251,114,153,0.3);
}
.nav-menu a.nav-bilibili:hover {
  background: rgba(251,114,153,0.1); border-color: #fb7299;
}
.nav-toggle {
  display: none; flex-direction: column; gap: 5px; cursor: pointer;
  background: none; border: none; padding: 8px;
}
.nav-toggle span {
  width: 24px; height: 2px; background: var(--ink-dark); border-radius: 2px;
  transition: all 0.3s ease;
}

/* 实时时间显示 */
.nav-time {
  position: absolute; right: 32px;
  display: flex; align-items: center; gap: 6px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 13px; color: var(--ink-mid);
  letter-spacing: 1px;
  background: rgba(255,255,255,0.5);
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--paper-deep);
}
.nav-time svg { width: 13px; height: 13px; color: var(--cinnabar); }
@media (max-width: 768px) {
  .nav-time { display: none; }
}

/* 主内容 */
.main-container {
  position: relative; z-index: 2; max-width: 900px;
  margin: 0 auto; padding: 120px 24px 80px;
}

/* 页面标题 */
.page-header {
  text-align: center; margin-bottom: 50px; position: relative;
}
.page-title {
  font-family: var(--font-display); font-size: 48px; color: var(--ink-deep);
  letter-spacing: 12px; margin-bottom: 16px; padding-left: 12px;
  text-shadow: 0 2px 8px rgba(26,22,19,0.1);
}
.page-subtitle {
  font-family: var(--font-serif); font-size: 16px; color: var(--ink-light);
  letter-spacing: 6px;
}
.page-divider {
  width: 120px; height: 2px; margin: 24px auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* 下载卡片 */
.download-card {
  background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
  border: 1px solid rgba(205,188,159,0.4); border-radius: 16px;
  padding: 32px; margin-bottom: 28px; position: relative;
  box-shadow: 0 4px 24px rgba(26,22,19,0.06);
  transition: all 0.3s ease; overflow: hidden;
}
.download-card:hover {
  box-shadow: 0 8px 32px rgba(26,22,19,0.1);
  border-color: rgba(201,169,110,0.5);
}
.download-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--cinnabar), var(--gold), var(--jade));
}

.download-card-header {
  display: flex; align-items: center; gap: 20px; margin-bottom: 24px;
}
.download-card-icon {
  width: 64px; height: 64px; border-radius: 14px;
  background: linear-gradient(135deg, var(--jade), var(--jade-deep));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(61,122,110,0.3);
  flex-shrink: 0;
}
.download-card-icon svg { width: 30px; height: 30px; color: white; }

.download-card-info { flex: 1; }
.download-card-name {
  font-family: var(--font-display); font-size: 24px; color: var(--ink-deep);
  letter-spacing: 3px; margin-bottom: 6px;
}
.download-card-desc {
  font-family: var(--font-sans); font-size: 14px; color: var(--ink-light);
}
.download-card-size {
  display: inline-block; margin-top: 8px;
  font-family: var(--font-sans); font-size: 12px; color: var(--gold-deep);
  background: rgba(201,169,110,0.12); padding: 2px 10px; border-radius: 10px;
}

/* 下载按钮组 */
.download-buttons {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}

.dl-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; border-radius: 12px;
  text-decoration: none; transition: all 0.3s ease;
  border: 2px solid transparent; cursor: pointer; position: relative; overflow: hidden;
}
.dl-btn-slow {
  background: linear-gradient(135deg, #fef9e7, #fdf2d1);
  border-color: rgba(201,169,110,0.3);
}
.dl-btn-slow:hover {
  border-color: var(--gold); transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(201,169,110,0.25);
}
.dl-btn-fast {
  background: linear-gradient(135deg, #e8f5f0, #d1ede4);
  border-color: rgba(61,122,110,0.3);
}
.dl-btn-fast:hover {
  border-color: var(--jade); transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(61,122,110,0.25);
}

.dl-btn-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.dl-btn-slow .dl-btn-icon { background: rgba(201,169,110,0.2); }
.dl-btn-fast .dl-btn-icon { background: rgba(61,122,110,0.2); }

.dl-btn-text { flex: 1; min-width: 0; }
.dl-btn-name {
  font-family: var(--font-display); font-size: 16px; color: var(--ink-deep);
  font-weight: 600; margin-bottom: 2px; letter-spacing: 2px;
}
.dl-btn-desc {
  font-family: var(--font-sans); font-size: 12px; color: var(--ink-light);
  line-height: 1.4;
}

.dl-btn-badge {
  flex-shrink: 0; padding: 3px 10px; border-radius: 10px;
  font-family: var(--font-sans); font-size: 11px; font-weight: 600;
  letter-spacing: 1px;
}
.dl-btn-slow .dl-btn-badge {
  background: rgba(201,169,110,0.25); color: var(--gold-deep);
}
.dl-btn-fast .dl-btn-badge {
  background: rgba(61,122,110,0.2); color: var(--jade-deep);
}

.download-tip {
  margin-top: 16px; padding: 12px 16px; border-radius: 8px;
  background: rgba(201,169,110,0.08); border-left: 3px solid var(--gold);
  font-family: var(--font-sans); font-size: 13px; color: var(--ink-mid);
  line-height: 1.6;
}

/* 页脚 */
.page-footer {
  text-align: center; margin-top: 60px; padding-top: 40px;
  border-top: 1px solid rgba(205,188,159,0.3);
}
.footer-seal {
  display: inline-flex; align-items: center; justify-content: center;
  width: 50px; height: 50px; background: var(--cinnabar); border-radius: 4px;
  margin-bottom: 16px; transform: rotate(-3deg);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15), 0 4px 12px rgba(184,52,46,0.3);
}
.footer-seal-text {
  font-family: var(--font-display); font-size: 26px; color: var(--paper-light);
  font-weight: 700;
}
.footer-text {
  font-family: var(--font-serif); font-size: 13px; color: var(--ink-faint);
  letter-spacing: 2px;
}
.back-home {
  display: inline-block; margin-top: 20px;
  font-family: var(--font-display); font-size: 14px; color: var(--cinnabar);
  text-decoration: none; padding: 8px 24px; border: 1px solid var(--cinnabar);
  border-radius: 20px; transition: all 0.3s ease;
}
.back-home:hover {
  background: var(--cinnabar); color: var(--paper-light);
}

/* 响应式 */
@media (max-width: 768px) {
  .top-nav { padding: 12px 16px; }
  .nav-title { font-size: 15px; letter-spacing: 2px; }
  .nav-toggle { display: flex; }
  .nav-menu {
    position: absolute; top: 100%; left: 0; right: 0;
    flex-direction: column; background: rgba(245,239,230,0.98);
    backdrop-filter: blur(12px); padding: 8px 0; gap: 0;
    transform: translateY(-10px); opacity: 0; visibility: hidden;
    transition: all 0.3s ease; border-bottom: 1px solid var(--paper-deep);
  }
  .nav-menu.open { transform: translateY(0); opacity: 1; visibility: visible; }
  .nav-menu li { width: 100%; }
  .nav-menu a { display: block; padding: 12px 24px; border-radius: 0; }
  .main-container { padding-top: 100px; }
  .page-title { font-size: 36px; letter-spacing: 8px; }
  .page-subtitle { font-size: 14px; letter-spacing: 4px; }
  .download-card { padding: 20px; }
  .download-card-header { gap: 14px; }
  .download-card-icon { width: 52px; height: 52px; }
  .download-card-name { font-size: 20px; }
  .download-buttons { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

</main>

<script>
function toggleNavMenu() {
  const menu = document.querySelector('.nav-menu');
  if (menu) menu.classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const menu = document.querySelector('.nav-menu');
  const toggle = document.querySelector('.nav-toggle');
  if (menu && toggle && !menu.contains(e.target) && !toggle.contains(e.target)) {
    menu.classList.remove('open');
  }
});

// 实时时间
(function() {
  const el = document.getElementById('navTimeText');
  if (!el) return;
  function update() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    el.textContent = h + ':' + m + ':' + s;
  }
  update();
  setInterval(update, 1000);
})();
</script>
